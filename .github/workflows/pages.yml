name: Deploy to GitHub Pages

# 정적 사이트다. 빌드 도구, 테스트 없이 저장소를 그대로 올린다.
# Jekyll을 거치지 않는다 — 불필요한 변환 단계를 피하기 위함.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 하나씩. 진행 중인 것을 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
