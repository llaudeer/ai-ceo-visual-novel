<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AI CEO: 인간과 알고리즘 사이</title>
<meta name="description" content="자본금 200만 원으로 시작하는 선택 중심 경영 시뮬레이션. 12개의 결정, 6가지 엔딩." />
<style>
/* ==========================================================
   AI CEO — 비주얼 노벨 엔진 (단일 파일 / 외부 요청 없음)
   팔레트 주제: 책상 램프의 호박색(사람) ↔ 알고리즘의 보라(AI)
   AI 의존도가 오를수록 무대 조명이 호박색에서 보라로 물든다.
   ========================================================== */
:root{
  /* ── ground ── */
  --ink:#080A10;
  --ink2:#0E121C;
  --panel:#141A28;
  --panel2:#1B2333;
  --line:#28324a;
  --line2:#3a4763;

  /* ── voice ── */
  --paper:#EDF1F8;
  --paper-dim:#9AA7BD;
  --paper-dim2:#65728a;

  /* ── the two poles ── */
  --warm:#F0A868;        /* 사람 / 책상 램프 */
  --warm-deep:#C2703A;
  --cold:#8B5CF6;        /* ARIA / 알고리즘 */
  --cold-lit:#C4B5FD;

  /* ── system ── */
  --ui:#5EEAD4;
  --good:#5FD08A;
  --warn:#E8B84B;
  --bad:#E5645C;

  /* 무대 조명 — aiDependence(0~100)에 따라 JS가 갱신 */
  --lamp:#F0A868;
  --lamp-soft:rgba(240,168,104,.20);
  --amb:22;

  --sans:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",
         -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,
         "D2Coding","Noto Sans KR",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:var(--sans);
  font-size:16px;line-height:1.7;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--ui);outline-offset:3px;border-radius:4px}

/* ══ 화면 골격 ═══════════════════════════════════════════ */
#game{
  position:fixed;inset:0;display:flex;flex-direction:column;
  max-width:1440px;margin:0 auto;
}

/* ══ 무대 ═══════════════════════════════════════════════ */
.stage{position:relative;flex:1;min-height:0;overflow:hidden}

/* 배경 레이어 */
.bg{position:absolute;inset:0;transition:opacity .9s ease}
.bg-sky{
  position:absolute;inset:0;
  background:linear-gradient(180deg,#0d1220 0%,#131a2b 55%,#0a0d15 100%);
}
.bg-glow{               /* 창밖 도시 + 램프 광원 */
  position:absolute;inset:0;
  background:
    radial-gradient(70% 55% at 78% 18%, var(--lamp-soft) 0%, transparent 70%),
    radial-gradient(50% 45% at 12% 88%, rgba(90,120,190,.14) 0%, transparent 70%);
  transition:background .9s ease;
}
.bg-art{position:absolute;inset:0;width:100%;height:100%}
.vig{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 95% at 50% 42%, transparent 42%, rgba(4,6,11,.82) 100%);
}
.grain{
  position:absolute;inset:-50%;pointer-events:none;opacity:.045;
  background-image:radial-gradient(rgba(255,255,255,.9) .5px, transparent .6px);
  background-size:3px 3px;
  animation:grain 1.1s steps(3) infinite;
}
@keyframes grain{
  0%{transform:translate(0,0)} 33%{transform:translate(-1px,1px)} 66%{transform:translate(1px,-1px)}
}

/* ══ 캐릭터 무대 ════════════════════════════════════════ */
.cast{
  position:absolute;left:0;right:0;bottom:0;top:0;
  display:flex;align-items:flex-end;justify-content:center;
  padding:0 3vw;
}
.slot{
  position:relative;flex:0 1 auto;margin:0 clamp(-14px,-.9vw,-2px);
  height:76%;max-height:520px;
  display:flex;align-items:flex-end;justify-content:center;
  transition:filter .45s ease, opacity .45s ease, transform .45s cubic-bezier(.2,.9,.3,1);
  transform:translateY(6px);
  filter:brightness(.78) saturate(.82);
  opacity:.92;
}
/* 누군가 말하는 중일 때만 나머지를 물린다. 나레이션에서는 전원 균등. */
.cast.focus .slot{filter:brightness(.46) saturate(.55) blur(.4px);opacity:.82}
.cast.focus .slot.on,.slot.on{
  filter:brightness(1.06) saturate(1.04);
  opacity:1;
  transform:translateY(-10px);
  z-index:3;
}
.slot.enter{animation:charIn .55s cubic-bezier(.2,.9,.3,1) both}
@keyframes charIn{from{opacity:0;transform:translateY(46px) scale(.97)}to{opacity:.85;transform:translateY(6px) scale(1)}}
.slot svg{height:100%;width:auto;display:block}
.slot .floor{
  position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
  width:76%;height:26px;border-radius:50%;
  background:radial-gradient(ellipse, rgba(0,0,0,.55), transparent 70%);
  filter:blur(3px);
}
.slot.talk{animation:talkBob .5s ease}
@keyframes talkBob{0%,100%{}50%{transform:translateY(-15px)}}

/* ══ HUD ════════════════════════════════════════════════ */
.hud{
  position:absolute;top:0;left:0;right:0;z-index:10;
  display:flex;align-items:flex-start;gap:14px;
  padding:14px 18px;
  background:linear-gradient(180deg,rgba(8,10,16,.9) 0%,rgba(8,10,16,0) 100%);
}
.hud-id{flex:none}
.hud-id .t{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--paper-dim2)}
.hud-id .w{font-size:13px;color:var(--paper-dim);font-variant-numeric:tabular-nums;margin-top:1px}
.gauges{
  flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;
  max-width:760px;
}
.g{position:relative}
.g .k{font-size:10px;letter-spacing:.02em;color:var(--paper-dim2);white-space:nowrap}
.g .v{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.35;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g .track{height:3px;border-radius:3px;background:#202940;overflow:hidden;margin-top:3px}
.g .track i{display:block;height:100%;border-radius:3px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.pop{
  position:absolute;right:0;top:-15px;font-size:11px;font-weight:800;
  font-variant-numeric:tabular-nums;pointer-events:none;
  animation:popUp 1.5s cubic-bezier(.2,.8,.2,1) forwards;
}
@keyframes popUp{
  0%{opacity:0;transform:translateY(8px)}
  18%{opacity:1;transform:translateY(0)}
  70%{opacity:1;transform:translateY(-3px)}
  100%{opacity:0;transform:translateY(-13px)}
}
.pop.up{color:var(--good)} .pop.down{color:var(--bad)}
.hud-btns{flex:none;display:flex;gap:6px}
.ib{
  width:32px;height:32px;border-radius:9px;border:1px solid var(--line);
  background:rgba(20,26,40,.7);display:grid;place-items:center;
  font-size:13px;color:var(--paper-dim);transition:.15s;
}
.ib:hover{border-color:var(--ui);color:var(--ui)}

/* ══ 장 표지 ════════════════════════════════════════════ */
.card{
  position:absolute;inset:0;z-index:30;display:grid;place-items:center;
  background:rgba(6,8,13,.93);
}
.card .in{text-align:center;animation:cardIn .8s cubic-bezier(.2,.9,.3,1) both}
@keyframes cardIn{from{opacity:0;letter-spacing:.5em}to{opacity:1;letter-spacing:.22em}}
.card .act{
  font-size:12px;font-weight:800;letter-spacing:.34em;color:var(--lamp);
  transition:color .9s ease;
}
.card .ttl{
  font-size:clamp(28px,5.2vw,48px);font-weight:800;letter-spacing:.14em;
  margin:10px 0 12px;
}
.card .wk{font-size:12px;letter-spacing:.2em;color:var(--paper-dim2);font-variant-numeric:tabular-nums}
.card .rule{width:44px;height:2px;background:var(--lamp);margin:20px auto 0;transition:background .9s ease}

/* ══ 대사창 ═════════════════════════════════════════════ */
.dock{
  position:relative;z-index:12;flex:none;
  height:clamp(230px,32vh,300px);
  border-top:1px solid var(--line);
  background:linear-gradient(180deg,rgba(14,18,28,.97) 0%,rgba(8,10,16,.99) 100%);
  backdrop-filter:blur(6px);
}
.dock::before{  /* 상단 하이라이트 */
  content:"";position:absolute;top:-1px;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--lamp),transparent);opacity:.5;
  transition:background .9s ease;
}
.dlg{height:100%;padding:20px clamp(20px,5vw,64px) 18px;display:flex;flex-direction:column;cursor:pointer}
.plate{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-height:26px}
.plate .chip{
  width:26px;height:26px;border-radius:8px;flex:none;
  display:grid;place-items:center;font-size:11px;font-weight:800;color:#0a0c12;
}
.plate .nm{font-size:15px;font-weight:700;letter-spacing:-.01em}
.plate .rl{font-size:11.5px;color:var(--paper-dim2)}
.plate .em{
  margin-left:auto;font-size:10.5px;letter-spacing:.06em;color:var(--paper-dim2);
  border:1px solid var(--line);border-radius:999px;padding:2px 9px;
}
.line{
  flex:1;display:flex;align-items:center;
  font-size:clamp(16px,1.85vw,21px);line-height:1.8;color:#DDE4EF;
  overflow-y:auto;padding-right:6px;max-width:62ch;
}
.line b{color:#fff;font-weight:700}
.line .hl{color:var(--lamp);font-weight:700;transition:color .9s ease}
.line.narr{color:var(--paper-dim);font-size:clamp(15px,1.7vw,19px)}
.line.ai{font-family:var(--mono);font-size:clamp(14px,1.6vw,18px);color:var(--cold-lit);letter-spacing:-.01em}
.caret{
  align-self:flex-end;font-size:11px;color:var(--paper-dim2);letter-spacing:.08em;
  display:flex;align-items:center;gap:7px;
}
.caret i{
  width:0;height:0;border-left:5px solid var(--paper-dim2);
  border-top:4px solid transparent;border-bottom:4px solid transparent;
  animation:blink 1.15s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:.25;transform:translateX(0)}50%{opacity:1;transform:translateX(3px)}}

/* ══ 선택지 ═════════════════════════════════════════════ */
.picker{height:100%;padding:16px clamp(20px,5vw,64px);display:flex;flex-direction:column}
.picker .q{
  font-size:11px;letter-spacing:.2em;color:var(--paper-dim2);margin-bottom:10px;flex:none;
}
.opts{flex:1;display:flex;flex-direction:column;gap:8px;overflow-y:auto;padding-right:4px}
.opt{
  display:flex;gap:13px;align-items:flex-start;text-align:left;width:100%;
  padding:11px 15px;border-radius:11px;
  border:1px solid var(--line);background:rgba(27,35,51,.55);
  transition:border-color .16s, background .16s, transform .1s;
}
.opt:hover{border-color:var(--lamp);background:rgba(37,47,68,.75);transform:translateX(3px)}
.opt .n{
  flex:none;width:21px;height:21px;border-radius:6px;background:#2a3550;
  font-size:11px;font-weight:800;display:grid;place-items:center;color:var(--paper-dim);
  margin-top:2px;transition:.16s;font-variant-numeric:tabular-nums;
}
.opt:hover .n{background:var(--lamp);color:#14100a}
.opt .lb{font-size:14.5px;font-weight:600;line-height:1.5}
.opt .ht{font-size:12.5px;color:var(--paper-dim);line-height:1.55;margin-top:2px}
.opt .rk{font-size:11.5px;color:var(--warn);margin-top:4px;display:block}

/* ══ 타이틀 / 엔딩 ══════════════════════════════════════ */
.full{
  position:absolute;inset:0;z-index:40;overflow-y:auto;
  background:radial-gradient(90% 70% at 50% 30%, #131a2b 0%, #070910 70%);
}
.mid{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
     padding:44px 22px;text-align:center}
.logo{font-size:clamp(38px,8.5vw,84px);font-weight:800;letter-spacing:-.03em;line-height:1}
.logo em{font-style:normal;color:var(--cold-lit)}
.sub{
  font-size:clamp(15px,2.4vw,21px);font-weight:600;letter-spacing:.16em;
  color:var(--paper-dim);margin-top:14px;
}
.hair{width:52px;height:1px;background:var(--line2);margin:26px 0}
.pitch{max-width:520px;color:var(--paper-dim);font-size:14.5px;line-height:1.9}
.pitch b{color:var(--paper)}
.rules{
  max-width:540px;text-align:left;margin-top:26px;
  border:1px solid var(--line);border-radius:14px;padding:16px 20px;background:rgba(20,26,40,.5);
}
.rules h4{font-size:11px;letter-spacing:.18em;color:var(--ui);margin-bottom:9px;font-weight:800}
.rules p{font-size:13px;color:var(--paper-dim);line-height:1.85}
.rules p b{color:var(--paper)}
.go{
  margin-top:30px;padding:15px 46px;border-radius:12px;
  background:var(--lamp);color:#150e06;font-size:16px;font-weight:800;letter-spacing:.04em;
  transition:transform .12s, filter .16s;
}
.go:hover{filter:brightness(1.09);transform:translateY(-1px)}
.go.ghost{background:transparent;border:1px solid var(--line2);color:var(--paper-dim);font-weight:700}
.go.ghost:hover{border-color:var(--ui);color:var(--ui)}
.foot{margin-top:20px;font-size:11.5px;color:var(--paper-dim2);letter-spacing:.04em}

.stamp{
  font-size:11px;letter-spacing:.26em;color:var(--paper-dim2);
  border:1px solid var(--line2);border-radius:999px;padding:5px 18px;
}
.etitle{font-size:clamp(26px,5.4vw,44px);font-weight:800;letter-spacing:-.02em;margin:18px 0 4px}
.epi{max-width:600px;text-align:left;margin-top:22px;display:flex;flex-direction:column;gap:13px}
.epi p{color:#CBD4E3;font-size:14.5px;line-height:1.92}
.sheet{
  max-width:600px;width:100%;margin-top:28px;text-align:left;
  border:1px solid var(--line);border-radius:14px;background:rgba(20,26,40,.5);padding:18px 20px;
}
.sheet h4{font-size:10.5px;letter-spacing:.18em;color:var(--paper-dim2);margin-bottom:12px}
.row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px dashed #1e2637}
.row:last-of-type{border:0}
.row span:first-child{color:var(--paper-dim)}
.row span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
.trail{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
       display:flex;flex-direction:column;gap:4px}
.trail div{font-size:12px;color:var(--paper-dim2);line-height:1.6}
.trail b{color:var(--paper-dim);font-weight:600}
.ask{font-size:14px;color:var(--paper-dim);font-style:italic;margin-top:26px;max-width:460px}

/* ══ 연출 ═══════════════════════════════════════════════ */
.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-7px)} 40%,60%{transform:translateX(7px)}
}
.flash::after{
  content:"";position:absolute;inset:0;z-index:20;pointer-events:none;
  background:#fff;animation:flash .5s ease-out forwards;
}
@keyframes flash{from{opacity:.75}to{opacity:0}}
.redalert::after{
  content:"";position:absolute;inset:0;z-index:8;pointer-events:none;
  background:radial-gradient(80% 60% at 50% 50%, transparent 40%, rgba(229,100,92,.3) 100%);
  animation:pulseRed 1.9s ease-in-out infinite;
}
@keyframes pulseRed{0%,100%{opacity:.35}50%{opacity:.9}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
                       transition-duration:.01ms!important}
}

/* ══ 반응형 ═════════════════════════════════════════════ */
/* 창이 낮을 때 대사창이 무대를 잡아먹지 않도록 */
@media (max-height:760px){
  .dock{height:clamp(178px,27vh,240px)}
  .dlg{padding-top:14px;padding-bottom:12px}
  .line{font-size:clamp(15px,1.6vw,18px);line-height:1.7}
  .plate{margin-bottom:6px}
  .picker{padding-top:11px}
  .picker .q{margin-bottom:7px}
  .opt{padding:8px 13px}
  .opt .ht{margin-top:1px}
  .opts{gap:6px}
}
@media (max-height:600px){
  .dock{height:clamp(150px,24vh,190px)}
  .slot{height:82%}
}
@media (max-width:900px){
  .gauges{grid-template-columns:repeat(4,1fr);max-width:none}
  .g:nth-child(n+5){display:none}
  .dock{height:clamp(220px,38vh,290px)}
}
@media (max-width:620px){
  body{font-size:15px}
  .gauges{grid-template-columns:repeat(3,1fr)}
  .g:nth-child(n+4){display:none}
  .hud{padding:10px 12px;gap:10px}
  .hud-id .t{font-size:11px}
  .dlg,.picker{padding-left:18px;padding-right:18px}
  .cast{padding:0 2px}
  .slot{height:70%;margin:0 -18px}
  /* 좁은 화면에서는 세 명이 다 안 들어간다 — 말하는 사람만 중앙에 세운다 */
  .cast.focus .slot:not(.on){
    flex:0 0 0;width:0;min-width:0;margin:0;opacity:0;overflow:hidden;
  }
  .cast.focus .slot.on{height:78%}
}
</style>

   2. 캐릭터 스프라이트 (인라인 SVG · 파라메트릭)
   ───────────────────────────────────────────────────────── */
const EXPR = {
  neutral:{ eye:"open",  brow:"flat",  mouth:"line"  },
  tired:  { eye:"narrow",brow:"flat",  mouth:"line"  },
  worry:  { eye:"open",  brow:"worry", mouth:"frown" },
  firm:   { eye:"narrow",brow:"angry", mouth:"wide"  },
  smile:  { eye:"happy", brow:"raise", mouth:"smile" },
  shock:  { eye:"wide",  brow:"raise", mouth:"open"  },
  sad:    { eye:"low",   brow:"worry", mouth:"frown" },
  cold:   { eye:"narrow",brow:"flat",  mouth:"line"  }
};

function eyes(kind, hue){
  const L=88, R=132, Y=134, d="#1A1410";
  const dot=(x)=>`<ellipse cx="${x}" cy="${Y}" rx="6.5" ry="7.5" fill="${d}"/>
                  <ellipse cx="${x+2}" cy="${Y-2.5}" rx="2" ry="2.2" fill="#fff" opacity=".85"/>`;
  switch(kind){
    case "narrow": return `<rect x="${L-7}" y="${Y-2}" width="14" height="4.5" rx="2.2" fill="${d}"/>
                           <rect x="${R-7}" y="${Y-2}" width="14" height="4.5" rx="2.2" fill="${d}"/>`;
    case "happy":  return `<path d="M${L-8},${Y+2} Q${L},${Y-8} ${L+8},${Y+2}" stroke="${d}" stroke-width="3.4" fill="none" stroke-linecap="round"/>
                           <path d="M${R-8},${Y+2} Q${R},${Y-8} ${R+8},${Y+2}" stroke="${d}" stroke-width="3.4" fill="none" stroke-linecap="round"/>`;
    case "wide":   return `<ellipse cx="${L}" cy="${Y}" rx="8" ry="9.5" fill="#fff"/><ellipse cx="${L}" cy="${Y}" rx="5" ry="6" fill="${d}"/>
                           <ellipse cx="${R}" cy="${Y}" rx="8" ry="9.5" fill="#fff"/><ellipse cx="${R}" cy="${Y}" rx="5" ry="6" fill="${d}"/>`;
    case "low":    return `<path d="M${L-8},${Y-1} Q${L},${Y+7} ${L+8},${Y-1}" stroke="${d}" stroke-width="3.4" fill="none" stroke-linecap="round"/>
                           <path d="M${R-8},${Y-1} Q${R},${Y+7} ${R+8},${Y-1}" stroke="${d}" stroke-width="3.4" fill="none" stroke-linecap="round"/>`;
    default:       return dot(L)+dot(R);
  }
}
function brows(kind, col){
  /* 눈썹은 앞머리에 가리지 않도록 눈 바로 위에 둔다. 표정의 대부분이 여기서 읽힌다. */
  const L=88,R=132,Y=118, s=`stroke="${col}" stroke-width="4.4" stroke-linecap="round" fill="none" opacity=".92"`;
  switch(kind){
    case "worry": return `<path d="M${L-10},${Y+3} L${L+9},${Y-2}" ${s}/><path d="M${R+10},${Y+3} L${R-9},${Y-2}" ${s}/>`;
    case "angry": return `<path d="M${L-10},${Y-3} L${L+9},${Y+3}" ${s}/><path d="M${R+10},${Y-3} L${R-9},${Y+3}" ${s}/>`;
    case "raise": return `<path d="M${L-10},${Y-3} Q${L},${Y-8} ${L+10},${Y-3}" ${s}/><path d="M${R-10},${Y-3} Q${R},${Y-8} ${R+10},${Y-3}" ${s}/>`;
    default:      return `<path d="M${L-10},${Y} L${L+10},${Y-1}" ${s}/><path d="M${R-10},${Y-1} L${R+10},${Y}" ${s}/>`;
  }
}
function mouth(kind){
  const X=110,Y=166, c="#8A4A44";
  switch(kind){
    case "smile": return `<path d="M${X-11},${Y-2} Q${X},${Y+9} ${X+11},${Y-2}" stroke="${c}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`;
    case "frown": return `<path d="M${X-9},${Y+4} Q${X},${Y-3} ${X+9},${Y+4}" stroke="${c}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    case "open":  return `<ellipse cx="${X}" cy="${Y+1}" rx="7" ry="9" fill="#5E2E2C"/>`;
    case "wide":  return `<rect x="${X-12}" y="${Y-2}" width="24" height="3.6" rx="1.8" fill="${c}"/>`;
    default:      return `<rect x="${X-8}" y="${Y-1}" width="16" height="3.2" rx="1.6" fill="${c}"/>`;
  }
}
/* 머리 — 뒤(back)/앞(front) 두 겹으로 실루엣을 만든다 */
function hairBack(style, col, tip){
  switch(style){
    case "ponytail": return `<ellipse cx="110" cy="128" rx="58" ry="64" fill="${col}"/>
      <path d="M158,120 q34,14 30,58 q-3,30 -22,34 q10,-34 -1,-58 q-8,-18 -20,-24 Z" fill="${col}"/>

    case "bob":      return `<path d="M52,132 q0,-70 58,-70 q58,0 58,70 q0,42 -6,58 l-104,0 q-6,-16 -6,-58 Z" fill="${col}"/>`;
    case "wave":     return `<path d="M50,130 q0,-70 60,-70 q60,0 60,70 q0,34 -4,52 q-10,-8 -14,4 q-8,-10 -16,2 l-52,0 q-8,-12 -16,-2 q-4,-12 -14,-4 q-4,-18 -4,-52 Z" fill="${col}"/>`;
    case "bangs":    return `<ellipse cx="110" cy="126" rx="57" ry="62" fill="${col}"/>
      ${tip?`<path d="M53,138 q4,34 10,44 l94,0 q6,-10 10,-44 q-16,20 -57,20 q-41,0 -57,-20 Z" fill="${tip}" opacity=".9"/>`:""}`;
    case "grey":     return `<ellipse cx="110" cy="124" rx="54" ry="58" fill="${col}"/>`;
    case "slick":    return `<ellipse cx="110" cy="124" rx="55" ry="59" fill="${col}"/>`;
    default:         return `<ellipse cx="110" cy="126" rx="56" ry="60" fill="${col}"/>`;
  }
}

  switch(style){
    case "sidepart": return `<path d="M56,120 q4,-56 56,-56 q50,0 54,50 q-12,-26 -44,-28 q-16,16 -46,14 q-14,4 -20,20 Z" fill="${col}"/>`;
    case "ponytail": return `<path d="M54,124 q6,-58 56,-58 q52,0 56,58 q-14,-34 -56,-34 q-42,0 -56,34 Z" fill="${col}"/>`;
    case "bangs":    return `<path d="M54,128 q2,-62 56,-62 q54,0 56,62 q-8,-26 -22,-24 q-4,20 -14,20 q-10,0 -14,-20 q-4,20 -14,20 q-10,0 -14,-20 q-14,-2 -22,24 Z" fill="${col}"/>`;
    case "bob":      return `<path d="M52,126 q2,-64 58,-64 q58,0 58,64 q-10,-30 -34,-32 q-14,14 -46,12 q-24,4 -36,20 Z" fill="${col}"/>`;
    case "wave":     return `<path d="M52,124 q4,-62 58,-62 q56,0 58,62 q-14,-32 -36,-30 q-18,16 -48,12 q-20,2 -32,18 Z" fill="${col}"/>`;
    case "slick":    return `<path d="M56,116 q6,-52 54,-52 q50,0 54,52 q-16,-20 -54,-18 q-38,-2 -54,18 Z" fill="${col}"/>
                             <path d="M70,96 q30,-16 74,4" stroke="#ffffff" stroke-opacity=".16" stroke-width="5" fill="none" stroke-linecap="round"/>`;
    case "grey":     return `<path d="M58,116 q8,-48 52,-48 q46,0 52,48 q-18,-24 -52,-22 q-34,-2 -52,22 Z" fill="${col}"/>`;
    default:         return "";
  }
}
function accessory(kind, hue){
  switch(kind){
    case "glasses": return `<g fill="none" stroke="#2C3648" stroke-width="3">
        <rect x="72" y="122" width="34" height="26" rx="8"/><rect x="114" y="122" width="34" height="26" rx="8"/>

    case "phones":  return `<path d="M62,120 a48,48 0 0 1 96,0" stroke="#1C2331" stroke-width="7" fill="none" opacity="0"/>
        <g transform="translate(0,86)"><rect x="46" y="118" width="20" height="30" rx="9" fill="#242C3C"/>
        <rect x="154" y="118" width="20" height="30" rx="9" fill="#242C3C"/>

    case "earring": return `<circle cx="60" cy="150" r="4.5" fill="${hue}"/><circle cx="160" cy="150" r="4.5" fill="${hue}"/>`;
    case "badge":   return `<g transform="translate(0,0)"><path d="M110,214 l0,34" stroke="#B7C2D4" stroke-width="3"/>
        <rect x="96" y="246" width="30" height="21" rx="4" fill="#E4E9F1"/>

function humanSVG(id, exprName){
  const c = CAST[id], a = c.art, e = EXPR[exprName] || EXPR.neutral;
  const shade = a.top2 || a.top;
  return `<svg viewBox="0 0 220 300" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
  <defs>
    <linearGradient id="rim_${id}" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--lamp)" stop-opacity=".5"/>

    </linearGradient>
    <clipPath id="face_${id}"><ellipse cx="110" cy="132" rx="47" ry="54"/></clipPath>
  </defs>

  <!-- 상체 -->
  <path d="M110,196 C58,198 26,232 22,300 L198,300 C194,232 162,198 110,196 Z" fill="${a.top}"/>
  <path d="M110,196 C84,198 66,214 58,238 L58,300 L22,300 C26,232 58,198 110,196 Z" fill="${shade}"/>
  <path d="M110,196 C58,198 26,232 22,300 L198,300 C194,232 162,198 110,196 Z" fill="url(#rim_${id})"/>
  <!-- 목 -->
  <path d="M92,168 L128,168 L128,200 Q110,210 92,200 Z" fill="${a.skin}"/>
  <path d="M92,168 L128,168 L128,182 Q110,192 92,182 Z" fill="#000" opacity=".16"/>
  ${accessory(a.acc, c.hue)}

  <!-- 머리 -->
  ${hairBack(a.hair, a.hairCol, a.hairTip)}
  <ellipse cx="63" cy="140" rx="8" ry="12" fill="${a.skin}"/>
  <ellipse cx="157" cy="140" rx="8" ry="12" fill="${a.skin}"/>
  <ellipse cx="110" cy="132" rx="47" ry="54" fill="${a.skin}"/>
  <g clip-path="url(#face_${id})">
    <ellipse cx="150" cy="120" rx="40" ry="52" fill="var(--lamp)" opacity=".13"/>
    <ellipse cx="70" cy="150" rx="34" ry="44" fill="#2A3550" opacity=".16"/>
  </g>
  ${hairFront(a.hair, a.hairCol)}
  <ellipse cx="86" cy="152" rx="8" ry="5" fill="#E08A80" opacity=".28"/>
  <ellipse cx="134" cy="152" rx="8" ry="5" fill="#E08A80" opacity=".28"/>
  ${brows(e.brow, a.hairCol)}
  ${eyes(e.eye, c.hue)}
  <path d="M110,146 q3,7 -2,10" stroke="#C79573" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  ${mouth(e.mouth)}
  ${a.acc==="glasses"?accessory("glasses",c.hue):""}
</svg>`;
}

/* ARIA — 사람이 아닌 존재. 회전하는 링과 코어. */
function ariaSVG(exprName){
  const agitated = (exprName==="firm"||exprName==="cold");
  return `<svg viewBox="0 0 220 300" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
  <defs>
    <radialGradient id="core">

    ${[0,60,120,180,240,300].map((d,i)=>{

    }).join("")}

  <style>
    @keyframes spinA{to{transform:rotate(360deg)}}

    @keyframes spinC{to{transform:rotate(360deg)}}
    @keyframes pulseA{0%,100%{opacity:.55}50%{opacity:1}}
  </style>
</svg>`;
}

/* 창밖 도시의 불빛. 좌표는 viewBox 단위(0~100 × 0~60) — 퍼센트를 쓰면 뷰포트마다 달라진다. */
function bokeh(n, seed, box){
  const b = box || { x:5, y:3, w:44, h:30 };
  let s=seed, out="";
  const rnd=()=> (s=(s*9301+49297)%233280)/233280;
  for(let i=0;i<n;i++){
    const x=b.x+rnd()*b.w, y=b.y+rnd()*b.h;
    const r=.16+rnd()*.42, o=.2+rnd()*.55;
    out+=`<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${r.toFixed(2)}" height="${(r*1.3).toFixed(2)}"
           fill="var(--lamp)" opacity="${o.toFixed(2)}"/>`;
  }
  return out;
}

   4. 상태 모델
   ───────────────────────────────────────────────────────── */
/* 표시 순서 = 중요도 순서. 좁은 화면에서는 뒤쪽부터 숨으므로,
   이 게임의 핵심 지표인 AI 의존도가 절대 먼저 잘리지 않게 앞에 둔다. */
const STATS = [
  { key:"cash",           label:"자금",      money:true },
  { key:"aiDependence",   label:"AI 의존",   max:100 },
  { key:"trust",          label:"신뢰",      max:100 },
  { key:"morale",         label:"사기",      max:100 },
  { key:"revenue",        label:"월 매출",   money:true },
  { key:"reputation",     label:"평판",      max:100 },
  { key:"productQuality", label:"품질",      max:100 }
];

function initialState(){
  return {
    cash:2000000, revenue:0, trust:50, morale:60,
    aiDependence:0, reputation:30, productQuality:40,
    sceneId:ORDER[0], flags:{}, history:[], week:1
  };
}

/** 상태 전이는 이 순수 함수 하나로만 일어난다. */
function applyEffects(state, effects){
  const n = { ...state, flags:{ ...state.flags }, history:[ ...state.history ] };
  for(const k in (effects||{})){
    if(k === "flag"){ n.flags[effects.flag] = true; continue; }
    if(!(k in n) || typeof effects[k] !== "number") continue;
    n[k] += effects[k];
  }
  for(const m of STATS) if(m.max != null) n[m.key] = Math.max(0, Math.min(m.max, n[m.key]));
  n.revenue = Math.max(0, n.revenue);
  return n;
}

/** 조건부 보정: 특정 플래그가 서 있으면 효과가 달라진다. */
function resolveEffects(state, choice){
  let fx = { ...choice.effects };
  if(choice.mod && state.flags[choice.mod.flag]){
    for(const k in choice.mod.effects){
      if(k === "flag"){ fx.flag = choice.mod.effects.flag; continue; }
      fx[k] = (fx[k] || 0) + choice.mod.effects[k];
    }
  }
  return fx;
}

   7. 사운드 (WebAudio · 파일 없음)
   ───────────────────────────────────────────────────────── */
const Sfx = (()=>{
  let ctx=null, on=true, lastTick=0;
  const boot=()=>{ if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ on=false; } }
                   if(ctx && ctx.state==="suspended") ctx.resume(); return ctx; };
  function tone(f, dur, type, vol, slideTo){
    if(!on) return; const c=boot(); if(!c) return;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(f, c.currentTime);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, c.currentTime+dur);
    g.gain.setValueAtTime(0, c.currentTime);
    g.gain.linearRampToValueAtTime(vol==null?.08:vol, c.currentTime+.012);
    g.gain.exponentialRampToValueAtTime(.0001, c.currentTime+dur);
    o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+dur+.02);
  }
  return {
    toggle(){ on=!on; if(on) boot(); return on; },
    get isOn(){ return on; },
    boot,
    tick(ai){ const t=performance.now(); if(t-lastTick<38) return; lastTick=t;
              tone(ai?880:1400, .022, ai?"square":"triangle", ai?.016:.024); },
    hover(){ tone(620,.05,"sine",.03); },
    pick(){ tone(420,.09,"triangle",.07,760); },
    up(){ tone(660,.16,"sine",.06,1050); },
    down(){ tone(340,.2,"sine",.06,190); },
    chapter(){ tone(300,.5,"sine",.05,460); setTimeout(()=>tone(450,.55,"sine",.04,600),150); },
    aria(){ tone(180,.9,"sawtooth",.028,320); setTimeout(()=>tone(720,.5,"sine",.022,900),90); },
    alarm(){ tone(760,.16,"square",.05,520); setTimeout(()=>tone(760,.16,"square",.05,520),220); },
    end(){ tone(260,1.3,"sine",.05,392); setTimeout(()=>tone(392,1.4,"sine",.04,523),260); }
  };
})();

/* ─────────────────────────────────────────────────────────
   8. 엔진
   ───────────────────────────────────────────────────────── */
let S, mode, beatQ, beatI, typer, typing, curSpeaker, lastBG, skipCard;
const root = document.getElementById("game");
const won = (n)=> n.toLocaleString("ko-KR")+"원";
const esc = (s)=> String(s).replace(/[&<>]/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));
/** 나레이션/대사에 허용하는 인라인 태그만 되살린다 */
const rich = (s)=> esc(s).replace(/&lt;span class='hl'&gt;/g,"<span class='hl'>")
                         .replace(/&lt;\/span&gt;/g,"</span>");

/* 무대 조명 = AI 의존도. 게임의 주제를 화면 색으로 말한다. */
function relight(){
  const t = Math.max(0, Math.min(1, (S ? S.aiDependence : 0)/100));
  const mix=(a,b)=>Math.round(a+(b-a)*t);
  const r=mix(240,139), g=mix(168,92), b=mix(104,246);
  const css=document.documentElement.style;
  css.setProperty("--lamp", `rgb(${r},${g},${b})`);
  css.setProperty("--lamp-soft", `rgba(${r},${g},${b},${(.2+t*.16).toFixed(3)})`);
}

function gaugeHTML(pops){
  return STATS.map(m=>{
    const v=S[m.key], txt=m.money?won(v):v;
    const pct = m.max ? (v/m.max)*100 : Math.max(0,Math.min(100,(v/6000000)*100));
    const col = m.key==="aiDependence" ? (v>65?"var(--cold)":v>35?"#7C7CF0":"#4a5570")
              : m.money ? (v<=0?"var(--bad)":"#54A8E0")
              : (v>=60?"var(--good)":v>=35?"var(--warn)":"var(--bad)");
    const d = pops && pops[m.key];
    return `<div class="g"><div class="k">${m.label}</div><div class="v">${txt}</div>
      <div class="track"><i style="width:${pct}%;background:${col}"></i></div>
      ${d?`<div class="pop ${d>0?"up":"down"}">${d>0?"+":""}${m.money?d.toLocaleString("ko-KR"):d}</div>`:""}
    </div>`;
  }).join("");
}

function hudHTML(pops){
  const sc = SCENES[S.sceneId];
  return `<div class="hud">
    <div class="hud-id">
      <div class="t">AI CEO</div>
      <div class="w">${sc?`${esc(sc.act)} · ${esc(sc.chapter)}`:"결산"}</div>
    </div>
    <div class="gauges">${gaugeHTML(pops)}</div>
    <div class="hud-btns">
      <button class="ib" id="snd" title="소리">${Sfx.isOn?"🔊":"🔇"}</button>
      <button class="ib" id="rst" title="처음부터">↺</button>
    </div>
  </div>`;
}

function stageHTML(sc){
  const cast = sc.cast.map(id=>
    `<div class="slot enter" data-c="${id}"><div class="floor"></div>${sprite(id,"neutral")}</div>`).join("");
  return `<div class="stage${sc.alert?" redalert":""}" id="stage">
    <div class="bg">
      <div class="bg-sky"></div>
      ${(BG_FOR[sc.bg]||BG_FOR.office_day)()}
      <div class="bg-glow"></div>
    </div>
    <div class="cast" id="cast">${cast}</div>
    <div class="vig"></div><div class="grain"></div>
    ${hudHTML()}
  </div>`;
}

/* ── 화면 ── */
function paintScene(){
  const sc = SCENES[S.sceneId];
  root.innerHTML = stageHTML(sc) + `<div class="dock" id="dock"></div>`;
  wireHud();
  lastBG = sc.bg;
}

function wireHud(){
  const s=document.getElementById("snd"), r=document.getElementById("rst");
  if(s) s.onclick=(e)=>{ e.stopPropagation(); s.textContent = Sfx.toggle()?"🔊":"🔇"; };
  if(r) r.onclick=(e)=>{ e.stopPropagation();
    if(confirm("처음부터 다시 시작할까요? 현재 진행은 사라집니다.")) title(); };
}

function chapterCard(sc, done){
  const st=document.getElementById("stage");
  const el=document.createElement("div");
  el.className="card";
  el.innerHTML=`<div class="in">
    <div class="act">${esc(sc.act)}</div>
    <div class="ttl">${esc(sc.chapter)}</div>
    <div class="wk">${sc.week}주차</div>
    <div class="rule"></div></div>`;
  st.appendChild(el);
  Sfx.chapter();
  let closed=false;
  const close=()=>{ if(closed) return; closed=true;
    el.style.transition="opacity .5s"; el.style.opacity="0";
    setTimeout(()=>{ el.remove(); done(); },500); };
  skipCard = close;
  setTimeout(close, 1750);
}

/* ── 대사 재생 ── */
function playBeats(list, after){
  beatQ = list.slice(); beatI = 0; mode = "beat";
  nextBeat(after);
}

function setSpeaker(id){
  const cast=document.getElementById("cast");
  if(cast) cast.classList.add("focus");
  document.querySelectorAll(".slot").forEach(el=>{
    const me = el.dataset.c === id;
    el.classList.toggle("on", me);
    if(me){ el.classList.remove("talk"); void el.offsetWidth; el.classList.add("talk"); }
  });
  curSpeaker = id;
}
function setExpr(id, expr){
  const el = document.querySelector(`.slot[data-c="${id}"]`);
  if(!el || !expr) return;
  const floor = el.querySelector(".floor");
  el.innerHTML = "";
  if(floor) el.appendChild(floor);
  el.insertAdjacentHTML("beforeend", sprite(id, expr));
}

function nextBeat(after){
  if(typing){ finishTyping(); return; }
  if(beatI >= beatQ.length){ after(); return; }
  const b = beatQ[beatI++];
  const dock = document.getElementById("dock");
  const isAI = b.w === "aria";

  if(b.w){
    const c = CAST[b.w];
    if(b.e) setExpr(b.w, b.e);
    setSpeaker(b.w);
    if(isAI && !document.querySelector(".slot.on[data-c='aria']")) Sfx.aria();
    dock.innerHTML = `<div class="dlg" id="dlg">
      <div class="plate">
        <div class="chip" style="background:${c.hue}">${c.tag}</div>
        <div><div class="nm" style="color:${c.hue}">${c.name}</div></div>
        <div class="rl">${c.role}</div>
      </div>
      <div class="line${isAI?" ai":""}" id="ln"></div>
      <div class="caret">계속 <i></i></div></div>`;
  } else {
    /* 나레이션 — 화자가 없으므로 전원을 균등한 밝기로 되돌린다 */
    const cast=document.getElementById("cast");
    if(cast) cast.classList.remove("focus");
    document.querySelectorAll(".slot").forEach(el=>el.classList.remove("on"));
    curSpeaker = null;
    dock.innerHTML = `<div class="dlg" id="dlg">
      <div class="plate"></div>
      <div class="line narr" id="ln"></div>
      <div class="caret">계속 <i></i></div></div>`;
  }
  if(b.fx === "shake"){ const st=document.getElementById("stage");
    st.classList.remove("shake"); void st.offsetWidth; st.classList.add("shake"); Sfx.alarm(); }
  if(b.fx === "flash"){ const st=document.getElementById("stage");
    st.classList.remove("flash"); void st.offsetWidth; st.classList.add("flash"); }

  document.getElementById("dlg").onclick = ()=> nextBeat(after);
  typeOut(b.t || b.n, isAI, ()=>{});
}

function typeOut(text, isAI, done){
  const el = document.getElementById("ln");
  const html = rich(text);
  el.innerHTML = ""; typing = true;
  // 태그를 건너뛰며 한 글자씩 노출
  let i = 0;
  const step = ()=>{
    if(i >= html.length){ typing=false; typer=null; done(); return; }
    if(html[i] === "<"){ const j = html.indexOf(">", i); i = (j<0? html.length : j+1); }
    else { i++; if(html[i-1] !== " ") Sfx.tick(isAI); }
    el.innerHTML = html.slice(0, i);
    typer = setTimeout(step, isAI ? 22 : 17);
  };
  step();
  el._full = html;
}
function finishTyping(){
  if(typer){ clearTimeout(typer); typer=null; }
  const el = document.getElementById("ln");
  if(el && el._full) el.innerHTML = el._full;
  typing = false;
}

/* ── 선택지 ── */
function showChoices(){
  mode = "choices";
  const sc = SCENES[S.sceneId];
  document.querySelectorAll(".slot").forEach(el=>el.classList.remove("on"));
  const opts = sc.choices.map((c,i)=>`
    <button class="opt" data-i="${i}">
      <span class="n">${i+1}</span>
      <span><span class="lb">${esc(c.label)}</span>
        <span class="ht">${esc(c.hint||"")}</span>
        ${c.risk?`<span class="rk">⚠ ${esc(c.risk)}</span>`:""}</span>
    </button>`).join("");
  document.getElementById("dock").innerHTML =
    `<div class="picker"><div class="q">${esc(sc.q||"선택")}</div><div class="opts">${opts}</div></div>`;
  document.querySelectorAll(".opt").forEach(b=>{
    b.onmouseenter = ()=> Sfx.hover();
    b.onclick = ()=> pick(+b.dataset.i);
  });
}

function pick(i){
  const sc = SCENES[S.sceneId];
  const c = sc.choices[i];
  const before = { ...S };
  Sfx.pick();

  S = applyEffects(S, resolveEffects(S, c));
  S.history.push({ act:sc.act, chapter:sc.chapter, week:sc.week, choice:c.label });

  const pops = {};
  let anyUp=false, anyDown=false;
  for(const m of STATS){
    const d = S[m.key]-before[m.key];
    if(d!==0){ pops[m.key]=d; d>0?anyUp=true:anyDown=true; }
  }
  const st=document.getElementById("stage");
  const old=st.querySelector(".hud"); if(old) old.remove();
  st.insertAdjacentHTML("beforeend", hudHTML(pops));
  wireHud(); relight();
  setTimeout(()=>{ if(anyUp) Sfx.up(); if(anyDown) setTimeout(()=>Sfx.down(),160); }, 120);

  playBeats(c.after || [], advance);
}

function advance(){
  if(S.cash < 0) return ending();
  const idx = ORDER.indexOf(S.sceneId);
  const nextId = ORDER[idx+1];
  if(!nextId) return ending();

  S.sceneId = nextId;
  const sc = SCENES[nextId];
  S.week = sc.week;
  if(sc.burn){
    S = applyEffects(S, { cash:-sc.burn });
    if(S.revenue > 0) S = applyEffects(S, { cash: Math.round(S.revenue*0.8) });
  }
  if(S.cash < 0) return ending();
  runScene();
}

function runScene(){
  const sc = SCENES[S.sceneId];
  mode = "card";   // 표지가 떠 있는 동안 이전 장면의 입력 모드가 살아 있으면 안 된다
  paintScene(); relight();
  chapterCard(sc, ()=> playBeats(sc.beats, showChoices));
}

/* ── 타이틀 ── */
function title(){
  mode="title"; S = initialState(); relight();
  root.innerHTML = `<div class="stage">
    <div class="bg"><div class="bg-sky"></div>${BG.office(true)}<div class="bg-glow"></div></div>
    <div class="vig"></div><div class="grain"></div>
    <div class="full"><div class="mid">
      <div class="logo">AI <em>CEO</em></div>
      <div class="sub">인간과 알고리즘 사이</div>
      <div class="hair"></div>
      <p class="pitch">자본금 <b>200만 원</b>. 직원 세 명. 그리고 무료 체험을 제안하는 AI 비서 하나.<br><br>
        정답을 맞히는 게임이 아닙니다.<br><b>무엇을 기준으로 결정할지</b> 고르는 게임입니다.</p>
      <div class="rules">
        <h4>플레이 방법</h4>
        <p>화면을 <b>클릭</b>하거나 <b>Space</b>로 대사를 넘깁니다. 타이핑 중에 누르면 즉시 전부 표시됩니다.<br>
        선택지는 <b>숫자 키 1~3</b> 또는 클릭으로 고릅니다.<br>
        선택은 자금·신뢰·사기·AI 의존도를 바꾸고, <b>화면의 조명 색</b>은 AI 의존도를 따라갑니다.<br>
        약 30주, <b>12번의 결정</b> 끝에 <b>6가지 엔딩</b> 중 하나에 도착합니다.</p>
      </div>
      <button class="go" id="go">게임 시작</button>
      <p class="foot">설치·로그인·네트워크 연결이 필요하지 않습니다 · 1회 플레이 약 12~18분</p>
    </div></div></div>`;
  const g=document.getElementById("go");
  g.focus();
  g.onclick = ()=>{ Sfx.boot(); S = initialState();
    const first = SCENES[ORDER[0]];
    if(first.burn) S = applyEffects(S, { cash:-first.burn });
    runScene(); };
}

/* ── 엔딩 ── */
function ending(){
  mode="ending";
  const e = ENDINGS.find(x=>x.test(S));
  Sfx.end();
  const rows = STATS.map(m=>
    `<div class="row"><span>${m.label}</span><span>${m.money?won(S[m.key]):S[m.key]}</span></div>`).join("");
  const trail = S.history.map(h=>
    `<div><b>${h.week}주차 · ${esc(h.chapter)}</b> — ${esc(h.choice)}</div>`).join("");
  const q = QUESTIONS[Math.floor(Math.random()*QUESTIONS.length)];

  root.innerHTML = `<div class="stage">
    <div class="bg"><div class="bg-sky"></div>${(BG_FOR[e.bg]||BG_FOR.dawn)()}<div class="bg-glow"></div></div>
    <div class="vig"></div><div class="grain"></div>
    <div class="full"><div class="mid">
      <div class="stamp">${esc(e.stamp)}</div>
      <h2 class="etitle">${esc(e.title)}</h2>
      <div class="epi">${e.epi.map(p=>`<p>${esc(p)}</p>`).join("")}</div>
      <div class="sheet">
        <h4>최종 상태 · ${S.week}주차</h4>
        ${rows}
        <div class="trail">${trail}</div>
      </div>
      <p class="ask">“${esc(q)}”</p>
      <button class="go" id="again">다시 시작</button>
      <button class="go ghost" id="toTitle" style="margin-top:10px">타이틀로</button>
    </div></div></div>`;
  const a=document.getElementById("again");
  a.focus();
  a.onclick = ()=>{ S=initialState();
    const f=SCENES[ORDER[0]]; if(f.burn) S=applyEffects(S,{cash:-f.burn}); runScene(); };
  document.getElementById("toTitle").onclick = title;
}

/* ── 입력 ── */
document.addEventListener("keydown", (ev)=>{
  if(ev.metaKey||ev.ctrlKey||ev.altKey) return;
  const tag = document.activeElement && document.activeElement.tagName;

  if(mode === "card"){
    if(ev.key===" "||ev.key==="Enter"){ ev.preventDefault(); if(skipCard) skipCard(); }
    return;   // 표지 위에서는 그 외 어떤 키도 삼킨다
  }
  if(mode === "beat" && (ev.key===" "||ev.key==="Enter")){
    if(tag === "BUTTON" && ev.key === "Enter") return;
    ev.preventDefault();
    nextBeat(pendingAfter());
    return;
  }
  if(mode === "choices"){
    const n = parseInt(ev.key,10);
    const sc = SCENES[S.sceneId];
    if(n>=1 && n<=sc.choices.length){ ev.preventDefault(); pick(n-1); }
    return;
  }
  if((mode==="title"||mode==="ending") && ev.key===" " && tag!=="BUTTON"){
    ev.preventDefault();
    const b=document.getElementById("go")||document.getElementById("again"); if(b) b.click();
  }
});
/* 대사 재생 중 "다음 단계" 콜백을 유지하기 위한 얇은 래퍼 */
let _after = ()=>{};
const _play = playBeats;
playBeats = function(list, after){ _after = after; _play(list, after); };
function pendingAfter(){ return _after; }

document.addEventListener("click", (ev)=>{
  if(mode==="card" && document.querySelector(".card") && skipCard){
    if(!ev.target.closest(".ib")) skipCard();
  }
});

/* 오류가 나도 진행이 막히지 않게 */
window.addEventListener("error", (e)=>{
  if(mode==="crash") return; mode="crash";
  root.innerHTML=`<div class="full"><div class="mid">
    <h2 class="etitle">문제가 발생했습니다</h2>
    <p class="pitch">${esc(e.message||"알 수 없는 오류")}</p>
    <button class="go" onclick="location.reload()">새로고침하고 다시 시작</button></div></div>`;
});

title();
</script>
