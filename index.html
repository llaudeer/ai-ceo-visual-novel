<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARIA : 7 WEEKS</title>
<meta name="description" content="3078년, 7주 안에 게임 하나를 출시해야 한다. AI 비서 ARIA와 다섯 명의 사람 사이에서 결정하는 3D 경영 시뮬레이션.">
<style>
  :root {
    --aria-hex: #A855F7;
    --aria-glow: #D8B4FE;
    --aria-dim: #5B21B6;
    --panel: rgba(11, 15, 26, 0.82);
    --line: rgba(148, 163, 184, 0.22);
    --ink: #E7ECF5;
    --ink-dim: #94A3B8;
    --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
            "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #05070C; overflow: hidden; }
  body { font-family: var(--font); color: var(--ink); }
  #stage { display: block; width: 100%; height: 100%; }
  /* HUD는 3D 위에 겹치는 DOM 레이어. 기본은 클릭을 통과시키고, 각 패널이 되살린다. */
  #hud {
    position: fixed; inset: 0; pointer-events: none;
    z-index: 10; overflow: hidden;
  }
  #boot {
    position: fixed; inset: 0; z-index: 30;
    display: grid; place-items: center;
    background: #05070C; color: var(--ink-dim);
    font-size: 13px; letter-spacing: 0.08em;
    transition: opacity 0.5s ease;
  }
  #boot.done { opacity: 0; pointer-events: none; }

  /* ── 타이틀 */
  #title {
    position: fixed; inset: 0; z-index: 25;
    display: none; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 6vh 24px;
    background: radial-gradient(ellipse at 50% 40%, rgba(88,28,135,0.28), rgba(5,7,12,0.94) 62%);
    backdrop-filter: blur(3px);
    animation: fade 1s ease;
  }
  #title.on { display: flex; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  #title .year { font-size: 12px; letter-spacing: 0.44em; color: var(--aria-hex); }
  #title h1 {
    margin: 14px 0 0; font-size: clamp(34px, 8vw, 76px); font-weight: 800;
    letter-spacing: 0.14em; line-height: 1;
    text-shadow: 0 0 60px var(--aria-hex);
  }
  #title .sub {
    margin-top: 16px; font-size: clamp(13px, 1.8vw, 16px); color: var(--ink-dim);
    line-height: 1.8; max-width: 480px;
  }
  #title .keys {
    margin-top: 30px; display: flex; flex-wrap: wrap; gap: 10px 22px; justify-content: center;
    font-size: 12px; color: var(--ink-dim);
  }
  #title kbd {
    display: inline-block; padding: 3px 8px; margin-right: 6px;
    border: 1px solid var(--line); border-radius: 3px;
    font-family: inherit; font-size: 11px; color: var(--ink);
  }
  #start {
    margin-top: 36px; padding: 15px 46px; cursor: pointer;
    font-family: inherit; font-size: 14px; letter-spacing: 0.2em; font-weight: 600;
    color: var(--ink); background: transparent;
    border: 1px solid var(--aria-hex); border-radius: 3px;
    box-shadow: 0 0 40px -12px var(--aria-hex);
    transition: background 0.22s ease, box-shadow 0.22s ease;
  }
  #start:hover { background: rgba(168, 85, 247, 0.18); box-shadow: 0 0 60px -10px var(--aria-hex); }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="hud"></div>

  <div id="title">
    <div class="year">3078 · TRIPLEDOT STUDIO</div>
    <h1>ARIA : 7 WEEKS</h1>
    <p class="sub">
      자금 100,000 CR. 남은 시간 7주.<br>
      게임 하나를 출시해야 한다.<br>
      AI 비서 ARIA는 언제나 더 빠른 답을 안다.
    </p>
    <div class="keys">
      <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>사무실 이동</span>
      <span><kbd>클릭</kbd>대사 진행</span>
      <span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd>선택</span>
    </div>
    <button id="start">시작하기</button>
  </div>

  <div id="boot">LOADING</div>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js"
    }
  }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
