<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>잔상 — 과거의 나를 피하라</title>
<style>
:root{
  --bg:#0a0d13;
  --bg-2:#10141d;
  --panel:#12161f;
  --line:#232a38;
  --text:#e7e9ee;
  --text-dim:#8890a0;
  --player:#5be8ff;
  --goal:#ffcf5c;
  --danger:#ff5c7a;
}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0;height:100%}
.wrap{
  font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;
  color:var(--text);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  min-height:100%;
  justify-content:center;
  padding:1.5rem 1rem 2rem;
  background:var(--bg);
}
h1{
  font-size:13px;
  font-weight:500;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--text-dim);
  margin:0;
}
.stage{
  position:relative;
  border-radius:10px;
  overflow:hidden;
  border:0.5px solid var(--line);
  box-shadow:0 0 0 1px rgba(0,0,0,0.4), 0 30px 60px -20px rgba(0,0,0,0.6);
  background:var(--bg-2);
  max-width:100%;
}
canvas{display:block;background:var(--bg-2);max-width:100%;height:auto}
.hud{
  position:absolute;top:0;left:0;right:0;
  display:flex;justify-content:space-between;
  padding:14px 18px;
  font-size:12px;
  letter-spacing:0.05em;
  pointer-events:none;
  text-transform:uppercase;
}
.hud .label{color:var(--text-dim);margin-right:6px}
.hud .val{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.overlay{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:14px;
  background:rgba(10,13,19,0.86);
  text-align:center;
  padding:24px;
}
.overlay.hidden{display:none}
.overlay h2{
  font-size:20px;font-weight:500;margin:0;
  color:var(--text);
}
.overlay h2.danger{color:var(--danger)}
.overlay p{
  font-size:13px;color:var(--text-dim);margin:0;
  max-width:280px;line-height:1.6;
}
.stats{
  display:flex;gap:24px;margin:2px 0 4px;
}
.stats .stat{display:flex;flex-direction:column;align-items:center;gap:4px}
.stats .stat span:first-child{font-size:11px;color:var(--text-dim);letter-spacing:0.08em;text-transform:uppercase}
.stats .stat span:last-child{font-size:22px;font-weight:500;color:var(--text);font-variant-numeric:tabular-nums}
.btn{
  margin-top:6px;
  padding:9px 20px;
  border-radius:6px;
  border:0.5px solid var(--line);
  background:var(--panel);
  color:var(--text);
  font-family:inherit;
  font-size:12px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  cursor:pointer;
}
.btn:hover{border-color:var(--player);color:var(--player)}
.foot{
  font-size:11px;color:var(--text-dim);
  letter-spacing:0.03em;
  max-width:520px;text-align:center;line-height:1.7;
}
.foot b{color:var(--text);font-weight:500}
.combo{
  position:absolute;right:14px;top:50%;
  transform:translateY(-50%) scale(0.85);
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:8px 12px;border-radius:8px;
  background:rgba(255,207,92,0.1);
  border:0.5px solid rgba(255,207,92,0.4);
  opacity:0;transition:opacity 0.2s ease,transform 0.2s ease;
  pointer-events:none;
}
.combo.show{opacity:1;transform:translateY(-50%) scale(1)}
.combo .cl{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--goal)}
.combo .cv{font-size:20px;font-weight:500;color:#ffe6a8;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <h1>잔상 — 과거의 나를 피하라</h1>
  <div class="stage">
    <canvas id="c" width="560" height="400"></canvas>
    <div class="hud">
      <div><span class="label">Lap</span><span class="val" id="lap">1</span></div>
      <div><span class="label">Best</span><span class="val" id="best">0</span></div>
      <div><span class="label">Coin</span><span class="val" id="coins">0</span></div>
      <div><span class="label">Time</span><span class="val" id="time">9.0</span></div>
    </div>
    <div class="overlay" id="overlay">
      <h2>잔상</h2>
      <p>화살표 또는 WASD로 이동해 금빛 코어를 모으세요.<br>매 랩이 끝나면 방금 움직인 경로가 유령이 되어 다음 랩부터 장애물이 됩니다.<br>15랩부터는 고정된 벽도 하나씩 늘어납니다.<br>유령을 아슬아슬하게 스치거나 코어를 먹으면 코인이 쌓입니다.</p>
      <button class="btn" id="start">시작</button>
    </div>
    <div class="overlay hidden" id="gameover">
      <h2 class="danger">게임 오버</h2>
      <div class="stats">
        <div class="stat"><span>도달 랩</span><span id="finalLap">0</span></div>
        <div class="stat"><span>최고 기록</span><span id="finalBest">0</span></div>
      </div>
      <p>과거의 나에게 붙잡혔습니다.</p>
      <button class="btn" id="restart">다시 시작</button>
    </div>
    <div class="combo" id="combo">
      <span class="cl">연속</span>
      <span class="cv" id="comboVal">3</span>
    </div>
  </div>
  <p class="foot"><b>컨셉 프로토타입</b> — 코인은 저장되지만 상점은 아직 없습니다. 다음으로는 상점 화면, 모바일 터치 조작이 추가될 예정입니다.</p>
</div>
<script>
(function(){
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  var LAP_MS = 9000;
  var PLAYER_R = 7;
  var GOAL_R = 11;
  var GHOST_R = 7;
  var PLAYER_SPEED = 3.1;
  var GHOST_SPEED_MIN = 0.82;
  var GHOST_SPEED_MAX = 0.95;
  var GHOST_SPEED_RAMP_PER_LAP = 0.005;

  // 랩이 오를수록 유령이 플레이어 속도의 82%에서 시작해 95%까지 서서히 빨라진다.
  function ghostSpeedPerMs(lap){
    var factor = Math.min(GHOST_SPEED_MAX, GHOST_SPEED_MIN + (lap-1)*GHOST_SPEED_RAMP_PER_LAP);
    return PLAYER_SPEED * factor * 60 / 1000;
  }

  var audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep(freq, dur, type, delay, vol){
    if(!audioCtx) return;
    var t0 = audioCtx.currentTime + (delay||0);
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol||0.18, t0+0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }
  function playStart(){ beep(440,0.08,'sine',0,0.12); }
  function playCollect(){ beep(660,0.09,'sine',0,0.18); beep(990,0.12,'sine',0.06,0.15); }
  function playFail(){ beep(180,0.25,'sawtooth',0,0.2); beep(90,0.3,'square',0.05,0.15); }
  function playGraze(){ beep(1300,0.05,'sine',0,0.1); }
  function playMini(){ beep(820,0.05,'triangle',0,0.1); }
  function playBoost(){ beep(520,0.06,'square',0,0.14); beep(780,0.08,'square',0.05,0.12); }

  // 상점 화폐: 코어를 먹거나 유령을 아슬아슬하게 스칠 때마다 1코인씩 쌓이고
  // 새로고침해도 유지된다. 상점 자체(구매 항목)는 아직 설계 전.
  var COIN_KEY = 'zansang_coins';
  var totalCoins = parseInt(localStorage.getItem(COIN_KEY) || '0', 10) || 0;
  function addCoins(n){
    totalCoins += n;
    localStorage.setItem(COIN_KEY, String(totalCoins));
    document.getElementById('coins').textContent = totalCoins;
  }

  var keys = {};
  window.addEventListener('keydown', function(e){
    keys[e.key.toLowerCase()] = true;
    if(['arrowup','arrowdown','arrowleft','arrowright',' '].indexOf(e.key.toLowerCase()) !== -1) e.preventDefault();
  });
  window.addEventListener('keyup', function(e){ keys[e.key.toLowerCase()] = false; });

  var state = {
    running:false,
    lap:1,
    best:0,
    lapStart:0,
    px: W/2, py: H-40, vx:0, vy:0,
    moveStarted:false, moveStart:0,
    pausedThisLap:false,
    streak:0,
    path: [],
    ghosts: [],
    goal: null,
    obstacles: [],
    minis: [],
    powerup: null,
    boostUntil: 0,
    shake:0,
    particles: []
  };

  function updateCombo(){
    var el = document.getElementById('combo');
    if(state.streak >= 3){
      document.getElementById('comboVal').textContent = state.streak;
      el.classList.add('show');
    } else {
      el.classList.remove('show');
    }
  }

  var SPAWN_X = W/2, SPAWN_Y = H-40;

  function rectCircleOverlap(rect, cx, cy, r){
    var closestX = Math.max(rect.x, Math.min(cx, rect.x+rect.w));
    var closestY = Math.max(rect.y, Math.min(cy, rect.y+rect.h));
    var dx = cx-closestX, dy = cy-closestY;
    return (dx*dx+dy*dy) < r*r;
  }

  function rectsOverlap(a,b,pad){
    return !(a.x+a.w+pad < b.x || b.x+b.w+pad < a.x || a.y+a.h+pad < b.y || b.y+b.h+pad < a.y);
  }

  // 15랩까지는 장애물 없이 유령 회피에만 집중하게 두고, 그 이후부터
  // 한 랩에 하나씩(최대 6개) 늘려 난이도를 서서히 올린다.
  function obstacleCountForLap(lap){
    return Math.max(0, Math.min(6, lap - 14));
  }

  function randObstacles(count){
    var obs = [];
    var tries = 0;
    while(obs.length < count && tries < 300){
      tries++;
      var w = 46 + Math.random()*54;
      var h = 14 + Math.random()*12;
      if(Math.random() < 0.5){ var tmp=w; w=h; h=tmp; }
      var rect = {
        x: 24 + Math.random()*(W-48-w),
        y: 24 + Math.random()*(H-48-h),
        w: w, h: h
      };
      if(rectCircleOverlap(rect, SPAWN_X, SPAWN_Y, 60)) continue;
      var overlaps = false;
      for(var i=0;i<obs.length;i++){ if(rectsOverlap(rect,obs[i],14)){ overlaps=true; break; } }
      if(overlaps) continue;
      obs.push(rect);
    }
    return obs;
  }

  function randGoal(obstacles){
    var tries = 0;
    while(tries < 300){
      tries++;
      var gx = 60 + Math.random()*(W-120);
      var gy = 50 + Math.random()*(H-160);
      var ok = true;
      for(var i=0;i<obstacles.length;i++){
        if(rectCircleOverlap(obstacles[i], gx, gy, GOAL_R+10)){ ok=false; break; }
      }
      if(ok) return {x:gx,y:gy};
    }
    return {x:SPAWN_X,y:80};
  }

  var MINI_R = 4;
  var POWERUP_R = 8;
  var NEAR_MISS_R = 16;
  var BOOST_MS = 2000;
  var BOOST_MULT = 1.35;

  function pointClear(x, y, obstacles, goal, minR){
    if(dist(x,y,goal.x,goal.y) < minR + GOAL_R) return false;
    if(dist(x,y,SPAWN_X,SPAWN_Y) < minR + 40) return false;
    for(var i=0;i<obstacles.length;i++){
      if(rectCircleOverlap(obstacles[i], x, y, minR+6)) return false;
    }
    return true;
  }

  function randMinis(obstacles, goal){
    var minis = [];
    var count = 2 + Math.floor(Math.random()*2);
    var tries = 0;
    while(minis.length < count && tries < 200){
      tries++;
      var x = 40 + Math.random()*(W-80);
      var y = 40 + Math.random()*(H-80);
      if(!pointClear(x, y, obstacles, goal, MINI_R)) continue;
      var tooClose = false;
      for(var i=0;i<minis.length;i++){ if(dist(x,y,minis[i].x,minis[i].y) < 40){ tooClose=true; break; } }
      if(tooClose) continue;
      minis.push({x:x, y:y, taken:false});
    }
    return minis;
  }

  function randPowerup(obstacles, goal){
    if(Math.random() > 0.25) return null;
    var tries = 0;
    while(tries < 200){
      tries++;
      var x = 40 + Math.random()*(W-80);
      var y = 40 + Math.random()*(H-80);
      if(pointClear(x, y, obstacles, goal, POWERUP_R)) return {x:x, y:y};
    }
    return null;
  }

  var ghostPalette = ['#8b7bff','#c17bff','#7b5bff','#5b3fbf','#3a2a80'];

  function resetRun(){
    state.lap = 1;
    state.ghosts = [];
    state.streak = 0;
    updateCombo();
    startLap();
  }

  function startLap(){
    state.moveStarted = false;
    state.moveStart = 0;
    state.pausedThisLap = false;
    state.px = SPAWN_X; state.py = SPAWN_Y; state.vx=0; state.vy=0;
    state.path = [];
    state.obstacles = randObstacles(obstacleCountForLap(state.lap));
    state.goal = randGoal(state.obstacles);
    state.minis = randMinis(state.obstacles, state.goal);
    state.powerup = randPowerup(state.obstacles, state.goal);
    for(var gi=0; gi<state.ghosts.length; gi++){ state.ghosts[gi].grazing = false; }
    document.getElementById('lap').textContent = state.lap;
  }

  function burst(x,y,color,n){
    for(var i=0;i<n;i++){
      var a = Math.random()*Math.PI*2, sp = 0.6+Math.random()*2.2;
      state.particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:color});
    }
  }

  function fail(){
    state.shake = 14;
    burst(state.px, state.py, '#ff5c7a', 26);
    playFail();
    state.streak = 0;
    updateCombo();
    var reached = state.lap - 1;
    if(reached > state.best){ state.best = reached; document.getElementById('best').textContent = state.best; }
    state.running = 'stunned';
    setTimeout(function(){
      document.getElementById('finalLap').textContent = reached;
      document.getElementById('finalBest').textContent = state.best;
      document.getElementById('gameover').classList.remove('hidden');
      state.running = false;
    }, 500);
  }

  // 별을 먹은 순간 곧바로 다음 랩이 시작되면 이동 중이던 키를 놓을 새가 없어
  // 다음 랩의 유령이 즉시 움직이는 것처럼 보인다. 짧은 정지 구간을 두어
  // 실제로 키에서 손을 뗄 시간을 준 뒤 다음 랩을 시작한다.
  function nextLap(){
    state.lap += 1;
    state.goal = null;
    state.moveStarted = false;
    state.running = 'transition';
    document.getElementById('lap').textContent = state.lap;
    setTimeout(function(){
      startLap();
      state.running = true;
    }, 500);
  }

  function completeGoal(){
    burst(state.goal.x, state.goal.y, '#ffcf5c', 22);
    playCollect();
    addCoins(1);
    if(state.pausedThisLap){ state.streak = 0; } else { state.streak += 1; }
    updateCombo();
    state.ghosts.unshift(buildGhostPath(state.path));
    nextLap();
  }

  function timeoutLap(){
    state.streak = 0;
    updateCombo();
    state.ghosts.unshift(buildGhostPath(state.path));
    nextLap();
  }

  function dist(x1,y1,x2,y2){ return Math.hypot(x1-x2,y1-y2); }

  // 기록된 시간이 아니라 이동 거리 기준으로 재생해, 원본에서 멈칫했던 구간이
  // 유령 재생에서는 그대로 멈춤으로 나오지 않고 일정한 속도로 이어지게 한다.
  function buildGhostPath(rawPath){
    var pts = [];
    for(var i=0;i<rawPath.length;i++){
      var p = rawPath[i];
      if(pts.length===0 || dist(pts[pts.length-1].x,pts[pts.length-1].y,p.x,p.y) > 0.01){
        pts.push({x:p.x, y:p.y});
      }
    }
    if(pts.length===0) pts.push({x:W/2,y:H-40});
    var cum = [0];
    for(var i=1;i<pts.length;i++){
      cum.push(cum[i-1] + dist(pts[i-1].x,pts[i-1].y,pts[i].x,pts[i].y));
    }
    return { pts:pts, cum:cum, total:cum[cum.length-1] };
  }

  function ghostPosAt(gp, elapsed){
    if(gp.pts.length===0) return null;
    var targetDist = elapsed * ghostSpeedPerMs(state.lap);
    if(targetDist <= 0 || gp.total<=0) return gp.pts[0];
    if(targetDist >= gp.total) return gp.pts[gp.pts.length-1];
    for(var i=1;i<gp.cum.length;i++){
      if(gp.cum[i] >= targetDist){
        var segLen = gp.cum[i]-gp.cum[i-1];
        var f = segLen>0 ? (targetDist-gp.cum[i-1])/segLen : 0;
        var a=gp.pts[i-1], b=gp.pts[i];
        return {x:a.x+(b.x-a.x)*f, y:a.y+(b.y-a.y)*f};
      }
    }
    return gp.pts[gp.pts.length-1];
  }

  function ghostTraveledIndex(gp, elapsed){
    var targetDist = elapsed * ghostSpeedPerMs(state.lap);
    var idx = 0;
    for(var i=0;i<gp.cum.length;i++){
      if(gp.cum[i] <= targetDist) idx = i; else break;
    }
    return idx;
  }

  function tick(){
    requestAnimationFrame(tick);
    if(!state.running) return;

    var now = performance.now();

    if(state.running === true){
      var ax=0, ay=0;
      if(keys['arrowleft']||keys['a']) ax -= 1;
      if(keys['arrowright']||keys['d']) ax += 1;
      if(keys['arrowup']||keys['w']) ay -= 1;
      if(keys['arrowdown']||keys['s']) ay += 1;

      if(!state.moveStarted && (ax!==0 || ay!==0)){
        state.moveStarted = true;
        state.moveStart = now;
      }
    }

    var elapsed = state.moveStarted ? (now - state.moveStart) : 0;
    var t = Math.min(elapsed, LAP_MS);
    document.getElementById('time').textContent = ((LAP_MS - t)/1000).toFixed(1);

    if(state.running === true && state.moveStarted){
      if(ax===0 && ay===0) state.pausedThisLap = true;
      var speed = (now < state.boostUntil) ? PLAYER_SPEED*BOOST_MULT : PLAYER_SPEED;
      var len = Math.hypot(ax,ay) || 1;
      var tryX = state.px + (ax/len)*speed;
      var tryY = state.py + (ay/len)*speed;
      tryX = Math.max(PLAYER_R, Math.min(W-PLAYER_R, tryX));
      tryY = Math.max(PLAYER_R, Math.min(H-PLAYER_R, tryY));

      var blockedX = false, blockedY = false;
      for(var oi=0; oi<state.obstacles.length; oi++){
        if(rectCircleOverlap(state.obstacles[oi], tryX, state.py, PLAYER_R)) blockedX = true;
        if(rectCircleOverlap(state.obstacles[oi], state.px, tryY, PLAYER_R)) blockedY = true;
      }
      if(!blockedX) state.px = tryX;
      if(!blockedY) state.py = tryY;
      state.path.push({t:elapsed, x:state.px, y:state.py});

      for(var mi=0; mi<state.minis.length; mi++){
        var mn = state.minis[mi];
        if(!mn.taken && dist(state.px,state.py,mn.x,mn.y) < PLAYER_R+MINI_R+2){
          mn.taken = true;
          burst(mn.x, mn.y, '#bfe9ff', 8);
          playMini();
        }
      }

      if(state.powerup && dist(state.px,state.py,state.powerup.x,state.powerup.y) < PLAYER_R+POWERUP_R){
        burst(state.powerup.x, state.powerup.y, '#7cf7c4', 16);
        playBoost();
        state.boostUntil = now + BOOST_MS;
        state.powerup = null;
      }

      if(elapsed > 550){
        for(var gi=0; gi<state.ghosts.length; gi++){
          var gpObj = state.ghosts[gi];
          var ghostPos = ghostPosAt(gpObj, elapsed);
          if(!ghostPos) continue;
          var gd = dist(state.px,state.py,ghostPos.x,ghostPos.y);
          if(gd < PLAYER_R+GHOST_R-5){
            fail();
            break;
          } else if(gd < NEAR_MISS_R){
            if(!gpObj.grazing){
              gpObj.grazing = true;
              addCoins(1);
              burst(state.px, state.py, '#e8f7ff', 6);
              playGraze();
            }
          } else {
            gpObj.grazing = false;
          }
        }
      }

      if(state.goal && dist(state.px,state.py,state.goal.x,state.goal.y) < PLAYER_R+GOAL_R){
        completeGoal();
      } else if(elapsed >= LAP_MS){
        timeoutLap();
      }
    }

    for(var i=state.particles.length-1;i>=0;i--){
      var p = state.particles[i];
      p.x+=p.vx; p.y+=p.vy; p.vx*=0.94; p.vy*=0.94; p.life-=0.035;
      if(p.life<=0) state.particles.splice(i,1);
    }
    if(state.shake>0) state.shake *= 0.85;

    draw(elapsed);
  }

  function draw(elapsed){
    ctx.save();
    var sx = (Math.random()-0.5)*state.shake, sy=(Math.random()-0.5)*state.shake;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = '#10141d';
    ctx.fillRect(0,0,W,H);

    ctx.translate(sx,sy);

    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for(var gx=0; gx<W; gx+=28){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,H); ctx.stroke(); }
    for(var gy=0; gy<H; gy+=28){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke(); }

    for(var oi=0; oi<state.obstacles.length; oi++){
      var ob = state.obstacles[oi];
      ctx.fillStyle = '#333c4d';
      ctx.fillRect(ob.x, ob.y, ob.w, ob.h);
      ctx.strokeStyle = '#4a5468';
      ctx.lineWidth = 1;
      ctx.strokeRect(ob.x+0.5, ob.y+0.5, ob.w-1, ob.h-1);
    }

    for(var gi=state.ghosts.length-1; gi>=0; gi--){
      var gp = state.ghosts[gi];
      var color = ghostPalette[Math.min(gi, ghostPalette.length-1)];
      var pos = ghostPosAt(gp, elapsed);
      if(!pos) continue;
      var upTo = ghostTraveledIndex(gp, elapsed);
      ctx.beginPath();
      ctx.moveTo(gp.pts[0].x, gp.pts[0].y);
      for(var i=1;i<=upTo;i++){ ctx.lineTo(gp.pts[i].x, gp.pts[i].y); }
      ctx.lineTo(pos.x, pos.y);
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.28;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.globalAlpha = 1;

      ctx.beginPath();
      ctx.arc(pos.x,pos.y,GHOST_R,0,Math.PI*2);
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.7;
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    for(var mi=0; mi<state.minis.length; mi++){
      var mn = state.minis[mi];
      if(mn.taken) continue;
      ctx.beginPath();
      ctx.arc(mn.x, mn.y, MINI_R, 0, Math.PI*2);
      ctx.fillStyle = '#bfe9ff';
      ctx.globalAlpha = 0.75 + Math.sin(performance.now()/300 + mi)*0.15;
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    if(state.powerup){
      var pr = state.powerup;
      var spin = performance.now()/500;
      ctx.save();
      ctx.translate(pr.x, pr.y);
      ctx.rotate(spin);
      ctx.beginPath();
      ctx.moveTo(0,-POWERUP_R); ctx.lineTo(POWERUP_R,0); ctx.lineTo(0,POWERUP_R); ctx.lineTo(-POWERUP_R,0);
      ctx.closePath();
      ctx.fillStyle = '#7cf7c4';
      ctx.shadowColor = 'rgba(124,247,196,0.8)';
      ctx.shadowBlur = 14;
      ctx.fill();
      ctx.restore();
      ctx.shadowBlur = 0;
    }

    if(state.goal){
      var pulse = 1 + Math.sin(performance.now()/220)*0.12;
      var pingT = (performance.now()/900) % 1;

      ctx.beginPath();
      ctx.arc(state.goal.x, state.goal.y, GOAL_R + pingT*24, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(255,207,92,' + (0.55*(1-pingT)) + ')';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(state.goal.x, state.goal.y, GOAL_R*pulse, 0, Math.PI*2);
      ctx.fillStyle = '#ffe6a8';
      ctx.shadowColor = 'rgba(255,207,92,0.95)';
      ctx.shadowBlur = 26;
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.beginPath();
      ctx.arc(state.goal.x, state.goal.y, GOAL_R*pulse, 0, Math.PI*2);
      ctx.strokeStyle = '#fff6df';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    if(elapsed < 550){
      ctx.beginPath();
      ctx.arc(state.px, state.py, PLAYER_R + 5 + Math.sin(performance.now()/60)*1.5, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(91,232,255,0.4)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    if(performance.now() < state.boostUntil){
      ctx.beginPath();
      ctx.arc(state.px, state.py, PLAYER_R + 4, 0, Math.PI*2);
      ctx.strokeStyle = '#7cf7c4';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(state.px, state.py, PLAYER_R, 0, Math.PI*2);
    ctx.fillStyle = '#5be8ff';
    ctx.shadowColor = 'rgba(91,232,255,0.75)';
    ctx.shadowBlur = 16;
    ctx.fill();
    ctx.shadowBlur = 0;

    for(var pi=0;pi<state.particles.length;pi++){
      var pt = state.particles[pi];
      ctx.beginPath();
      ctx.arc(pt.x,pt.y,2.4,0,Math.PI*2);
      ctx.fillStyle = pt.color;
      ctx.globalAlpha = Math.max(pt.life,0);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  document.getElementById('start').addEventListener('click', function(){
    ensureAudio();
    playStart();
    document.getElementById('overlay').classList.add('hidden');
    state.running = true;
    resetRun();
  });

  document.getElementById('restart').addEventListener('click', function(){
    ensureAudio();
    playStart();
    document.getElementById('gameover').classList.add('hidden');
    state.running = true;
    resetRun();
  });

  document.getElementById('coins').textContent = totalCoins;
  draw(0);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
